<!doctype html>
<html lang="pl">
  <head>
    <meta charset="utf-8" />
    <title>Grupa Sportex — przekierowanie</title>
    <meta name="robots" content="noindex" />
    <script>
      /*
       * GitHub Pages nie przepisuje adresów SPA. Ten plik obsługuje każdy adres,
       * którego nie ma jako osobnego pliku: zamienia ścieżkę na ?/<reszta>
       * i przekierowuje do index.html, który odtwarza właściwy adres
       * przez history.replaceState (router pokaże wtedy stronę lub 404).
       *
       * __BASE_PATH__ jest podmieniany przy buildzie (scripts/prerender.mjs),
       * dzięki czemu działa zarówno w katalogu głównym, jak i w podkatalogu
       * GitHub Pages (np. /grupasportex-demo/).
       */
      (function () {
        var base = "__BASE_PATH__";
        var l = window.location;
        var path = l.pathname;
        var rest = path.indexOf(base) === 0 ? path.slice(base.length) : path.replace(/^\/+/, "");
        var target =
          l.origin +
          base +
          "?/" +
          rest +
          (l.search ? "&" + l.search.slice(1).replace(/&/g, "~and~") : "") +
          l.hash;
        l.replace(target);
      })();
    </script>
  </head>
  <body>
    <p>Przekierowanie… <a href="./">Przejdź do strony głównej</a></p>
  </body>
</html>
